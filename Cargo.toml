[package]
name = "reefmt"
version = "0.7.127"
edition = "2021"

[[bin]]
name = "reefmt"
path = "src/main.rs"

[dependencies]
glob = "0.3"
similar = "2"
serde = { version = "1", features = ["derive"] }
json5 = "0.4"
rayon = "1"

# SWC for native JS/TS formatting (no subprocess)
swc_core = { version = "69", features = [
	"ecma_parser",
	"ecma_codegen",
	"ecma_ast",
	"common",
	"ecma_visit",
	"swc_atoms",
] }
malva = "0.16.0"



















